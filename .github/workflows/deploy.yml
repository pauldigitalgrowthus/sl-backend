name: CI/CD Pipeline - SL Music Backend (GHCR Free Registry)

on:
  push:
    branches:
      - main
      - uat
  pull_request:
    branches:
      - main
      - uat
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push to GHCR (Distroless)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (100% Free)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Determine Environment & Image Tags
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_NAME="production"
            TAGS="ghcr.io/${REPO_LOWER}:production-${{ github.sha }},ghcr.io/${REPO_LOWER}:production-latest,ghcr.io/${REPO_LOWER}:latest"
          elif [ "${{ github.ref }}" = "refs/heads/uat" ]; then
            ENV_NAME="uat"
            TAGS="ghcr.io/${REPO_LOWER}:uat-${{ github.sha }},ghcr.io/${REPO_LOWER}:uat-latest"
          else
            ENV_NAME="staging"
            TAGS="ghcr.io/${REPO_LOWER}:pr-${{ github.event.number }}"
          fi
          echo "ENV_NAME=${ENV_NAME}" >> $GITHUB_OUTPUT
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT

      - name: 🔨 Build & Push Multi-Stage Distroless Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            APP_ENV=${{ steps.meta.outputs.ENV_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy Container to EC2 Server
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'uat' }}

    steps:
      - name: 🚀 Deployment Notice
        run: |
          echo "=========================================================="
          echo "Image successfully pushed to GitHub Container Registry!"
          echo "Target Server: 3.144.70.62"
          echo "Environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'uat' }}"
          echo "RDS Database: ${{ github.ref == 'refs/heads/main' && 'sl_music_prod' || 'sl_music_uat' }}"
          echo "S3 Bucket: sl-music-publication (Ohio us-east-2)"
          echo "=========================================================="
