name: CI/CD Pipeline - SL Music Backend

on:
  push:
    branches:
      - main
      - uat
  pull_request:
    branches:
      - main
      - uat
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (Multi-stage Distroless)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Security Audit
        run: npm audit --audit-level=high || true

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Determine Environment & Tags
        id: env-meta
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=production" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=production-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=production-latest" >> $GITHUB_OUTPUT
            echo "DB_NAME=sl_music_prod" >> $GITHUB_OUTPUT
            echo "DB_USER=sl_prod_user" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/uat" ]; then
            echo "ENV_NAME=uat" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=uat-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=uat-latest" >> $GITHUB_OUTPUT
            echo "DB_NAME=sl_music_uat" >> $GITHUB_OUTPUT
            echo "DB_USER=sl_uat_user" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=staging" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
            echo "LATEST_TAG=pr-latest" >> $GITHUB_OUTPUT
            echo "DB_NAME=sl_music_uat" >> $GITHUB_OUTPUT
            echo "DB_USER=sl_uat_user" >> $GITHUB_OUTPUT
          fi

      - name: 🔨 Build Distroless Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            sl-backend:${{ steps.env-meta.outputs.IMAGE_TAG }}
            sl-backend:${{ steps.env-meta.outputs.LATEST_TAG }}
          build-args: |
            APP_ENV=${{ steps.env-meta.outputs.ENV_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/uat')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'uat' }}

    steps:
      - name: 🚀 Deployment Status
        run: |
          echo "Deploying to Environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'uat' }}"
          echo "Target RDS Host: sl-database-main.c9isy40g0iyc.us-east-2.rds.amazonaws.com"
          echo "Target Database: ${{ github.ref == 'refs/heads/main' && 'sl_music_prod' || 'sl_music_uat' }}"
          echo "Target S3 Bucket: sl-music-publication (Region: us-east-2)"
