<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Activity History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(135deg, #020617, #020617);
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 16px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    input, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .log-card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .log-header {
      padding: 14px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .log-header:hover {
      background: #020617;
    }

    .meta {
      font-size: 12px;
      color: #94a3b8;
    }

    .activities {
      display: none;
      border-top: 1px solid #1e293b;
    }

    .activity {
      padding: 12px;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 4px;
      background: #1e293b;
      margin-right: 6px;
    }

    pre {
      background: #020617;
      border: 1px solid #1e293b;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      overflow-x: auto;
    }

    .empty {
      color: #94a3b8;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<h1>📊 User Activity History</h1>

<div class="controls">
  <input id="userId" placeholder="User ID (optional)" />
  <input id="date" type="date" />
  <button onclick="loadLogs()">Load Logs</button>
</div>

<div id="logs"></div>

<script>
  /* 🔑 IMPORTANT */
  const API_BASE = "http://localhost:5000/api/activity-history";

  // 🔴 TEMP: paste ADMIN JWT here if HTML is outside app
  const TOKEN =
    localStorage.getItem("token") ||
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImlhdCI6MTc3MDk5NTMyNiwiZXhwIjoxNzcxMDgxNzI2fQ.zz93TX2VKAuwm0JVepSqUF8lcCuokTqxNzTGsY29W1Y";

  async function loadLogs() {
    const userId = document.getElementById("userId").value.trim();
    const date = document.getElementById("date").value;

    let url = `${API_BASE}/daily`;

    if (userId && date) {
      url = `${API_BASE}/user/${userId}/date/${date}`;
    } else if (userId) {
      url = `${API_BASE}/user/${userId}`;
    }

    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${TOKEN}`
      }
    });

    const json = await res.json();

    if (!json.success) {
      alert(json.message || "Failed");
      return;
    }

    const data = Array.isArray(json.data) ? json.data : [json.data];
    render(data);
  }

  function render(logs) {
    const container = document.getElementById("logs");
    container.innerHTML = "";

    if (!logs.length) {
      container.innerHTML = `<div class="empty">No activity found</div>`;
      return;
    }

    logs.forEach(log => {
      const card = document.createElement("div");
      card.className = "log-card";

      const header = document.createElement("div");
      header.className = "log-header";
      header.innerHTML = `
        <div>
          <strong>${log.user.name}</strong><br>
          <span class="meta">${log.user.email}</span>
        </div>
        <div class="meta">
          ${log.device.browser} • ${log.device.os}<br>
          ${log.activity_count} actions
        </div>
      `;

      const activities = document.createElement("div");
      activities.className = "activities";

      log.activities.forEach(a => {
        const el = document.createElement("div");
        el.className = "activity";
        el.innerHTML = `
          <div>
            <span class="badge">${a.action}</span>
            <span class="badge">${a.module}</span>
            ${a.page ? `<span class="badge">${a.page}</span>` : ""}
          </div>
          <div class="meta">${a.time || ""} • ${a.api || ""}</div>
          ${a.payload ? `<pre>${JSON.stringify(a.payload, null, 2)}</pre>` : ""}
        `;
        activities.appendChild(el);
      });

      header.onclick = () => {
        activities.style.display =
          activities.style.display === "block" ? "none" : "block";
      };

      card.appendChild(header);
      card.appendChild(activities);
      container.appendChild(card);
    });
  }

  loadLogs();
</script>

</body>
</html>
