<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EduFlow LMS</title>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0f;
  --surface: #111118;
  --surface2: #1a1a24;
  --border: #2a2a38;
  --accent: #6c63ff;
  --accent2: #ff6584;
  --accent3: #43e97b;
  --text: #f0f0f8;
  --text2: #9898b8;
  --text3: #5a5a7a;
  --admin: #ff6b6b;
  --educator: #6c63ff;
  --student: #43e97b;
  --radius: 14px;
  --shadow: 0 8px 32px rgba(0,0,0,0.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Satoshi', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: 'Clash Display', sans-serif; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.hidden { display: none !important; }
.flex { display: flex; }
.gap-1 { gap: 8px; }
.gap-2 { gap: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

#toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
.toast { padding: 14px 20px; border-radius: 10px; font-size: 0.88rem; font-weight: 500; animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 10px; max-width: 320px; }
.toast.success { background: #1a2e1f; border: 1px solid #43e97b44; color: #43e97b; }
.toast.error { background: #2e1a1a; border: 1px solid #ff6b6b44; color: #ff6b6b; }
.toast.info { background: #1a1a2e; border: 1px solid #6c63ff44; color: #a5a1ff; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }

#global-loader { position: fixed; inset: 0; background: var(--bg); z-index: 9998; display: flex; align-items: center; justify-content: center; }
.loader-ring { width: 48px; height: 48px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-sm { width: 20px; height: 20px; border-width: 2px; }

#login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.login-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 50%, rgba(108,99,255,0.15) 0%, transparent 60%), radial-gradient(ellipse at 80% 20%, rgba(255,101,132,0.1) 0%, transparent 50%), radial-gradient(ellipse at 60% 80%, rgba(67,233,123,0.08) 0%, transparent 50%); }
.login-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 60px 60px; opacity: 0.3; }
.login-card { position: relative; z-index: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 48px 40px; width: 100%; max-width: 440px; box-shadow: var(--shadow), 0 0 80px rgba(108,99,255,0.1); animation: fadeUp 0.5s ease; }
@keyframes fadeUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.login-logo-icon { width: 44px; height: 44px; background: var(--accent); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
.login-logo h1 { font-size: 1.5rem; }
.login-title { font-size: 1.75rem; margin-bottom: 6px; }
.login-sub { color: var(--text2); font-size: 0.9rem; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
.form-label { display: block; font-size: 0.82rem; color: var(--text2); margin-bottom: 8px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
.form-input { width: 100%; padding: 13px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: 'Satoshi', sans-serif; font-size: 0.95rem; outline: none; transition: border 0.2s; }
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,99,255,0.15); }
textarea.form-input { resize: vertical; min-height: 90px; }
.form-select { appearance: none; cursor: pointer; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 24px; border-radius: 10px; border: none; cursor: pointer; font-family: 'Satoshi', sans-serif; font-weight: 600; font-size: 0.95rem; transition: all 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #7d75ff; transform: translateY(-1px); }
.btn-danger { background: var(--admin); color: #fff; }
.btn-success { background: var(--student); color: #000; }
.btn-warning { background: rgba(255,165,0,0.2); color: orange; border: 1px solid rgba(255,165,0,0.3); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--accent); color: var(--accent); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 16px; font-size: 0.85rem; border-radius: 8px; }
.btn-xs { padding: 5px 12px; font-size: 0.8rem; border-radius: 6px; }
.base-url-hint { font-size: 0.8rem; color: var(--text3); margin-top: 20px; text-align: center; }
.base-url-hint span { color: var(--accent); font-family: monospace; }

#app { display: flex; min-height: 100vh; }
.sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.sidebar-logo { padding: 22px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
.sidebar-logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.sidebar-logo h2 { font-size: 1.1rem; }
.sidebar-role-badge { margin: 14px 20px 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.73rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; text-align: center; }
.role-admin { background: rgba(255,107,107,0.15); color: var(--admin); border: 1px solid rgba(255,107,107,0.3); }
.role-educator { background: rgba(108,99,255,0.15); color: var(--educator); border: 1px solid rgba(108,99,255,0.3); }
.role-student { background: rgba(67,233,123,0.15); color: var(--student); border: 1px solid rgba(67,233,123,0.3); }
.sidebar-nav { flex: 1; padding: 8px 12px; }
.nav-section { margin-bottom: 22px; }
.nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text3); padding: 4px 8px; margin-bottom: 4px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 0.9rem; color: var(--text2); transition: all 0.15s; margin-bottom: 2px; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: rgba(108,99,255,0.15); color: var(--accent); }
.nav-icon { font-size: 1rem; width: 20px; text-align: center; }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid var(--border); }
.user-card { display: flex; align-items: center; gap: 12px; }
.user-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; }
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 0.88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-role { font-size: 0.75rem; color: var(--text2); }
.logout-btn { cursor: pointer; color: var(--text3); font-size: 1.1rem; padding: 4px; border-radius: 6px; transition: color 0.2s; background: none; border: none; }
.logout-btn:hover { color: var(--admin); }

.main-content { flex: 1; overflow-y: auto; }
.page-header { padding: 28px 32px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-title { font-size: 1.7rem; }
.page-sub { color: var(--text2); font-size: 0.9rem; margin-top: 4px; }
.page-content { padding: 24px 32px 40px; }

.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; transition: border-color 0.2s, transform 0.2s; }
.stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.stat-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text2); margin-bottom: 10px; }
.stat-value { font-size: 2rem; font-family: 'Clash Display', sans-serif; font-weight: 700; }
.stat-icon { font-size: 1.4rem; margin-bottom: 12px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 20px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.card-title { font-size: 1.05rem; font-weight: 600; }

.table-wrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
thead { background: var(--surface2); }
th { padding: 12px 16px; text-align: left; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text2); font-weight: 600; }
td { padding: 14px 16px; border-top: 1px solid var(--border); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,0.02); }

.badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
.badge-draft { background: rgba(152,152,184,0.15); color: var(--text2); }
.badge-published { background: rgba(67,233,123,0.15); color: var(--student); }
.badge-pending { background: rgba(255,165,0,0.15); color: orange; }
.badge-submitted_for_review { background: rgba(255,165,0,0.15); color: orange; }
.badge-rejected { background: rgba(255,107,107,0.15); color: var(--admin); }
.badge-approved { background: rgba(108,99,255,0.15); color: var(--accent); }
.badge-free { background: rgba(67,233,123,0.1); color: var(--student); }
.badge-paid { background: rgba(255,101,132,0.1); color: var(--accent2); }
.badge-proposal_submitted { background: rgba(255,165,0,0.15); color: orange; }
.badge-proposal_rejected { background: rgba(255,107,107,0.15); color: var(--admin); }
.badge-in_development { background: rgba(152,152,184,0.15); color: var(--text2); }
.badge-revision_requested { background: rgba(255,165,0,0.15); color: orange; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; animation: fadeUp 0.25s ease; box-shadow: var(--shadow); }
.modal-lg { max-width: 720px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.modal-title { font-size: 1.2rem; }
.modal-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.3rem; padding: 4px; border-radius: 6px; transition: color 0.2s; }
.modal-close:hover { color: var(--admin); }
.modal-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: flex-end; }

.config-bar { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; gap: 12px; font-size: 0.82rem; }
.config-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--student); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.config-url { color: var(--accent); font-family: monospace; }

.progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--student)); border-radius: 3px; transition: width 0.5s ease; }

.empty-state { text-align: center; padding: 48px 24px; color: var(--text2); }
.empty-icon { font-size: 3rem; margin-bottom: 16px; }
.empty-text { font-size: 1rem; margin-bottom: 8px; color: var(--text); }
.empty-sub { font-size: 0.85rem; }

.chapter-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.chapter-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; }
.chapter-title { font-weight: 600; font-size: 0.95rem; }
.chapter-meta { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.lesson-list { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.lesson-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
.lesson-name { flex: 1; font-size: 0.88rem; }
.lesson-duration { font-size: 0.78rem; color: var(--text2); }

.quiz-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; padding: 14px 16px; }
.quiz-item-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.quiz-item-title { font-weight: 600; font-size: 0.95rem; }
.quiz-item-meta { font-size: 0.8rem; color: var(--text2); margin-top: 2px; }
.qtype-badge { display: inline-block; padding: 2px 9px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; background: rgba(108,99,255,0.15); color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
.question-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.question-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.question-num { color: var(--text2); font-size: 0.8rem; font-weight: 600; }
.option-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: pointer; font-size: 0.9rem; transition: border-color 0.15s; }
.option-row:hover { border-color: var(--accent); }
.option-row.selected { border-color: var(--accent); background: rgba(108,99,255,0.1); }
.option-row.correct-answer { border-color: var(--student); background: rgba(67,233,123,0.1); }
.option-row.wrong-answer { border-color: var(--admin); background: rgba(255,107,107,0.1); }
.option-row input[type="radio"], .option-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); flex-shrink: 0; }
.option-mini-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: 0.85rem; }
.order-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px; cursor: grab; }
.order-handle { color: var(--text3); font-size: 0.9rem; }
.match-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-bottom: 8px; }
.match-pill { padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; font-size: 0.88rem; }
.quiz-progress-pill { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface2); border-radius: 10px; margin-bottom: 16px; font-size: 0.88rem; }
.result-summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 20px; }
.result-stat { background: var(--surface2); border-radius: 10px; padding: 16px; text-align: center; }
.result-stat-val { font-size: 1.6rem; font-family: 'Clash Display', sans-serif; font-weight: 700; }
.result-stat-label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
.locked-banner { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: rgba(255,165,0,0.1); border: 1px solid rgba(255,165,0,0.25); border-radius: 10px; color: orange; font-size: 0.88rem; margin-bottom: 16px; }

@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
  .sidebar { width: 220px; }
  .page-content { padding: 16px; }
  .page-header { padding: 16px 16px 0; }
  .result-summary { grid-template-columns: 1fr; }
  .match-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="toast-container"></div>
<div id="global-loader"><div class="loader-ring"></div></div>

<!-- LOGIN PAGE -->
<div id="login-page" class="hidden">
  <div class="login-bg"></div>
  <div class="login-grid"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🎓</div>
      <h1>EduFlow LMS</h1>
    </div>
    <h2 class="login-title">Welcome back</h2>
    <p class="login-sub">Sign in to access your dashboard</p>
    <div class="form-group">
      <label class="form-label">API Base URL</label>
      <input class="form-input" id="base-url-input" type="text" placeholder="https://your-api.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-input" id="login-email" type="email" placeholder="user@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" id="login-password" type="password" placeholder="••••••••" />
    </div>
    <button class="btn btn-primary btn-block" onclick="handleLogin()">Sign In →</button>
    <p class="base-url-hint">Connected to: <span id="base-url-preview">http://localhost:5000</span></p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div class="config-bar" style="position:fixed;top:0;left:0;right:0;z-index:200;">
    <div class="config-dot"></div>
    <span style="color:var(--text2)">API:</span>
    <span class="config-url" id="config-url-display"></span>
    <span style="margin-left:auto;color:var(--text3);font-family:monospace;font-size:0.75rem" id="token-preview"></span>
  </div>

  <div class="sidebar" style="margin-top:37px;">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🎓</div>
      <h2>EduFlow</h2>
    </div>
    <div id="role-badge" class="sidebar-role-badge"></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="user-avatar" id="user-avatar-abbr">U</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">User</div>
          <div class="user-role" id="sidebar-user-role">–</div>
        </div>
        <button class="logout-btn" onclick="handleLogout()" title="Logout">⏻</button>
      </div>
    </div>
  </div>

  <div class="main-content" style="margin-top:37px;">
    <div id="page-container"></div>
  </div>
</div>

<div id="modal-container"></div>

<script>
/* ── STATE ── */
let STATE = {
  token: localStorage.getItem('edu_token') || '',
  user: JSON.parse(localStorage.getItem('edu_user') || 'null'),
  baseUrl: localStorage.getItem('edu_base_url') || '/',
  currentPage: 'dashboard'
};

/* ── API ── */
async function api(method, path, body = null, multipart = false) {
  const url = `${STATE.baseUrl}/api${path}`;
  const headers = {};
  if (STATE.token) headers['Authorization'] = `Bearer ${STATE.token}`;
  if (!multipart && body) headers['Content-Type'] = 'application/json';
  const opts = { method, headers };
  if (body) opts.body = multipart ? body : JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || `HTTP ${res.status}`);
  return data;
}

/* ── TOAST ── */
function toast(msg, type = 'info') {
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

/* ── LOADER ── */
function showLoader() { document.getElementById('global-loader').classList.remove('hidden'); }
function hideLoader() { document.getElementById('global-loader').classList.add('hidden'); }

/* ── MODAL ── */
function openModal(html) {
  document.getElementById('modal-container').innerHTML =
    `<div class="modal-overlay" onclick="if(event.target===this)closeModal()">${html}</div>`;
}
function closeModal() { document.getElementById('modal-container').innerHTML = ''; }

/* ── FORMATTERS ── */
const fmt = {
  date: d => d ? new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) : '–',
  badge: s => {
    const m = { draft:'badge-draft', published:'badge-published', submitted_for_review:'badge-pending', rejected:'badge-rejected', approved:'badge-approved', free:'badge-free', paid:'badge-paid', pending:'badge-pending', active:'badge-published', inactive:'badge-draft', proposal_submitted:'badge-proposal_submitted', proposal_rejected:'badge-proposal_rejected', in_development:'badge-in_development', revision_requested:'badge-revision_requested' };
    return `<span class="badge ${m[s]||'badge-draft'}">${(s||'–').replace(/_/g,' ')}</span>`;
  },
  lessonIcon: t => ({ video:'▶', text:'📄', pdf:'📋', audio:'🎵', quiz:'❓', assignment:'✍' })[t] || '📁',
  money: (a, c='USD') => a && a > 0 ? `${c} ${parseFloat(a).toFixed(2)}` : 'Free',
  qtype: t => ({ mcq_single:'Single Choice', mcq_multiple:'Multiple Choice', true_false:'True / False', fill_blank:'Fill in the Blank', matching:'Matching', ordering:'Ordering' })[t] || t
};

/* ── ROLE ── */
function getUserRole() {
  if (!STATE.user) return 'student';
  const u = STATE.user;
  if (['admin','superadmin'].includes(u.user_type)) return 'admin';
  const badges = Array.isArray(u.badges) ? u.badges : (typeof u.badges === 'string' ? JSON.parse(u.badges||'[]') : []);
  if (u.role === 'educator' || badges.includes('Educator')) return 'educator';
  return 'student';
}

/* ── AUTH ── */
async function handleLogin() {
  const baseUrl = (document.getElementById('base-url-input').value.trim() || 'http://localhost:5000').replace(/\/+$/, '');
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  if (!email || !pass) return toast('Email and password required', 'error');
  STATE.baseUrl = baseUrl;
  localStorage.setItem('edu_base_url', baseUrl);
  showLoader();
  try {
    const data = await api('POST', '/auth/login', { email, password: pass });
    const payload = data.data || data;
    STATE.token = payload.token;
    STATE.user = payload.user;
    localStorage.setItem('edu_token', STATE.token);
    localStorage.setItem('edu_user', JSON.stringify(STATE.user));
    toast('Login successful!', 'success');
    initApp();
  } catch(e) { toast(e.message || 'Login failed', 'error'); }
  finally { hideLoader(); }
}

function handleLogout() {
  STATE.token = ''; STATE.user = null;
  localStorage.removeItem('edu_token'); localStorage.removeItem('edu_user');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-page').classList.remove('hidden');
  toast('Logged out', 'info');
}

/* ── INIT ── */
function initApp() {
  const role = getUserRole();
  const u = STATE.user || {};
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('config-url-display').textContent = STATE.baseUrl;
  document.getElementById('token-preview').textContent = STATE.token ? STATE.token.slice(0,24)+'…' : 'no token';
  const badge = document.getElementById('role-badge');
  badge.textContent = role.toUpperCase();
  badge.className = `sidebar-role-badge role-${role}`;
  const name = `${u.first_name||''} ${u.last_name||''}`.trim() || 'User';
  document.getElementById('sidebar-user-name').textContent = name;
  document.getElementById('sidebar-user-role').textContent = u.email || role;
  document.getElementById('user-avatar-abbr').textContent = name[0]?.toUpperCase() || 'U';
  buildNav(role);
  navigateTo('dashboard');
}

function buildNav(role) {
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = '';
  (NAV[role] || []).forEach(section => {
    const sec = document.createElement('div');
    sec.className = 'nav-section';
    sec.innerHTML = `<div class="nav-section-title">${section.section}</div>`;
    section.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'nav-item';
      el.id = `nav-${item.id}`;
      el.innerHTML = `<span class="nav-icon">${item.icon}</span><span>${item.label}</span>`;
      el.onclick = () => navigateTo(item.id);
      sec.appendChild(el);
    });
    nav.appendChild(sec);
  });
}

function navigateTo(page) {
  STATE.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.getElementById(`nav-${page}`);
  if (activeEl) activeEl.classList.add('active');
  renderPage(page);
}

/* ── PAGE ROUTER ── */
async function renderPage(page) {
  const c = document.getElementById('page-container');
  c.innerHTML = `<div style="padding:60px;text-align:center"><div class="loader-ring" style="margin:auto"></div></div>`;
  try {
    const pages = {
      'dashboard': renderDashboard,
      'my-courses': renderMyCourses,
      'create-course': renderCreateCourse,
      'submit-proposal': renderSubmitProposal,
      'all-courses': renderAllCourses,
      'review-pending': renderPendingReview,

      'my-learning': renderMyLearning,
      'published-courses': renderPublishedCourses,
      'my-enrollments-educator': renderEducatorEnrollments,
      'educator-tools': renderEducatorTools,
      'profile': renderProfile,
    };
    if (pages[page]) await pages[page]();

      <div class="stat-card"><div class="stat-icon">✏️</div><div class="stat-label">Drafts</div><div class="stat-value" style="color:var(--text2)">${draft}</div></div>
      <div class="stat-card"><div class="stat-icon">👥</div><div class="stat-label">Total Students</div><div class="stat-value" style="color:var(--accent)">${students}</div></div>
    </div>`;
    if (courses.length) {
      body = `<div class="card"><div class="card-header"><span class="card-title">Recent Courses</span><button class="btn btn-outline btn-sm" onclick="navigateTo('my-courses')">View All</button></div>
        <div class="table-wrap"><table><thead><tr><th>Title</th><th>Status</th><th>Type</th><th>Students</th><th>Date</th></tr></thead><tbody>

        </tbody></table></div></div>`;
    }
  }
  else {
    const [er] = await Promise.allSettled([api('GET','/educator/enrollments/my')]);
    const enr = er.value?.data?.enrollments || [];
    const comp = enr.filter(e=>e.completed).length;
    const avgProg = enr.length ? Math.round(enr.reduce((a,e)=>a+(e.progress_percentage||0),0)/enr.length) : 0;
    stats = `<div class="grid-4" style="margin-bottom:24px">

function myCourseRowActions(c) {
  const s = c.status;
  let actions = '';
  if (s === 'proposal_submitted') {
    actions = `<span style="font-size:0.78rem;color:orange">⏳ Awaiting Gate 1 review</span>`;
  } else if (s === 'proposal_rejected') {
    actions = `<button class="btn btn-outline btn-xs" onclick="openCourseFeedbackModal(${c.id})">📋 Feedback</button>`;
    if (c.can_resubmit !== 0 && c.can_resubmit !== false) {
      actions += `<button class="btn btn-warning btn-xs" onclick="navigateTo('submit-proposal')">↻ Resubmit</button>`;
    }
  } else if (['draft','in_development','revision_requested'].includes(s)) {
    actions = `<button class="btn btn-outline btn-xs" onclick="openCourseDetail(${c.id})">📂 Build</button>
      <button class="btn btn-warning btn-xs" onclick="submitCourse(${c.id})">Submit</button>`;
    if (s === 'revision_requested') actions += `<button class="btn btn-outline btn-xs" onclick="openCourseFeedbackModal(${c.id})">📋 Feedback</button>`;
  } else if (s === 'submitted_for_review') {
    actions = `<button class="btn btn-outline btn-xs" onclick="openCourseDetail(${c.id})">📂 Build</button><span style="font-size:0.78rem;color:orange">⏳ Under final review</span>`;
  } else if (s === 'approved') {
    actions = `<span style="font-size:0.78rem;color:var(--accent)">✅ Approved – awaiting publish</span>`;
  } else if (s === 'published') {
    actions = `<button class="btn btn-outline btn-xs" onclick="openCourseDetail(${c.id})">📂 View</button>`;
  } else if (s === 'rejected') {
    actions = `<button class="btn btn-outline btn-xs" onclick="openCourseFeedbackModal(${c.id})">📋 Feedback</button>`;
  } else {
    actions = `<button class="btn btn-outline btn-xs" onclick="openCourseDetail(${c.id})">📂 Build</button>`;
  }
  actions += `<button class="btn btn-xs" style="background:rgba(255,107,107,0.1);color:var(--admin)" onclick="deleteCourse(${c.id})">✕</button>`;
  return actions;
}

function openCourseFeedbackModal(courseId) {
  api('GET', '/educator/courses/my').then(data => {
    const c = (data.data?.courses || []).find(x => x.id === courseId);
    if (!c) return toast('Course not found', 'error');
    openModal(`<div class="modal">
      <div class="modal-header"><h3 class="modal-title">Review Feedback</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="margin-bottom:12px">${fmt.badge(c.status)}</div>
      ${c.rejection_category?`<div style="margin-bottom:12px"><p class="form-label">Category</p><p>${c.rejection_category.replace(/_/g,' ')}</p></div>`:''}
      ${c.rejection_reason?`<div style="margin-bottom:12px;padding:14px;background:rgba(255,107,107,0.1);border-radius:10px;border:1px solid rgba(255,107,107,0.2)"><p style="color:var(--admin);font-size:0.88rem"><strong>Reason:</strong> ${c.rejection_reason}</p></div>`:''}
      ${c.admin_feedback?`<div style="padding:14px;background:var(--surface2);border-radius:10px"><p style="font-size:0.88rem"><strong>Feedback:</strong> ${c.admin_feedback}</p></div>`:''}
      ${c.status==='proposal_rejected'?`<p style="margin-top:14px;font-size:0.85rem;color:var(--text2)">${(c.can_resubmit!==0&&c.can_resubmit!==false)?'✓ You may revise and resubmit this proposal.':'✕ Resubmission is not allowed for this proposal.'}</p>`:''}
      <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>
    </div>`);
  }).catch(e => toast(e.message, 'error'));
}

async function createCourse() {

    course_type: document.getElementById('c-type').value,

function splitToArray(val) {
  return (val || '').split(',').map(s => s.trim()).filter(Boolean);
}

async function submitProposal() {
  const title = document.getElementById('pp-title').value.trim();
  const desc = document.getElementById('pp-desc').value.trim();
  const modulesRaw = document.getElementById('pp-modules').value.trim();
  const lessonTitle = document.getElementById('pp-lesson-title').value.trim();
  if (!title || !desc || !modulesRaw || !lessonTitle) return toast('Please fill in all required (*) fields', 'error');

  const modules = modulesRaw.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
    const [t, d] = line.split('|').map(s => s?.trim());
    return { title: t || line, description: d || '' };
  });

  const fd = new FormData();
  fd.append('course_title', title);
  fd.append('course_description', desc);
  fd.append('category', document.getElementById('pp-cat').value);
  fd.append('subcategory', document.getElementById('pp-subcat').value);
  fd.append('target_audience', JSON.stringify(splitToArray(document.getElementById('pp-audience').value)));
  fd.append('technology_tools', JSON.stringify(splitToArray(document.getElementById('pp-tools').value)));
  fd.append('learning_outcomes', JSON.stringify(splitToArray(document.getElementById('pp-outcomes').value)));
  fd.append('modules', JSON.stringify(modules));
  fd.append('sample_lesson_title', lessonTitle);
  fd.append('sample_lesson_objective', document.getElementById('pp-lesson-obj').value);
  fd.append('teaching_flow', document.getElementById('pp-flow').value);
  fd.append('assessment_method', document.getElementById('pp-assessment').value);
  fd.append('video_duration_minutes', document.getElementById('pp-video-dur').value || 0);
  fd.append('motivation', document.getElementById('pp-motivation').value);
  const videoFile = document.getElementById('pp-video').files[0];
  if (videoFile) fd.append('sample_video', videoFile);

  try {
    showLoader();
    await api('POST', '/educator/courses/proposal', fd, true);
    toast('Proposal submitted! Awaiting SL Team review.', 'success');
    navigateTo('my-courses');
  } catch(e) { toast(e.message, 'error'); } finally { hideLoader(); }
}

async function openCourseDetail(courseId) {
  showLoader();
  try {
    const chapRes = await api('GET', `/educator/courses/${courseId}/chapters`);
    const chapters = chapRes.data || [];
    const chHtml = await buildChaptersHtml(courseId, chapters);
    openModal(`<div class="modal modal-lg">
      <div class="modal-header"><h3 class="modal-title">📚 Build the Course</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
      <div style="margin-bottom:16px" class="flex gap-1" style="flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" onclick="openAddChapter(${courseId})">+ Add Chapter</button>
        <button class="btn btn-outline btn-sm" onclick="openQuizManager(${courseId})">🧩 Manage Quizzes</button>
        <button class="btn btn-outline btn-sm" onclick="openResourceManager(${courseId})">📎 Resources</button>
        <button class="btn btn-outline btn-sm" onclick="openCourseSettings(${courseId})">⚙ Settings</button>
      </div>
      <div id="chapters-container">${chHtml}</div>
    </div>`);
  } catch(e) { toast(e.message,'error'); } finally { hideLoader(); }
}

async function buildChaptersHtml(courseId, chapters) {
  if (!chapters.length) return '<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-text">No chapters yet</div><div class="empty-sub">Add your first chapter above</div></div>';
  const parts = await Promise.all(chapters.map(async ch => {
    const lr = await api('GET', `/educator/courses/${courseId}/chapters/${ch.id}/lessons`).catch(()=>({data:[]}));
    const lessons = lr.data || [];
    return `<div class="chapter-item">
      <div class="chapter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <div><div class="chapter-title">📖 ${ch.title}</div><div class="chapter-meta">${lessons.length} lessons · Order ${ch.chapter_order}</div></div>
        <div class="flex gap-1" onclick="event.stopPropagation()">
          <button class="btn btn-xs btn-outline" onclick="openAddLesson(${courseId},${ch.id})">+ Lesson</button>
          <button class="btn btn-xs" style="background:rgba(255,107,107,0.1);color:var(--admin)" onclick="deleteChapter(${courseId},${ch.id})">✕</button>
        </div>
      </div>
      <div class="lesson-list" style="display:flex">
        ${lessons.map(l=>`<div class="lesson-item">
          <span>${fmt.lessonIcon(l.lesson_type)}</span>
          <span class="lesson-name">${l.title}</span>
          <span class="lesson-duration">${l.video_duration_minutes||0}m</span>
          ${l.is_preview?'<span class="badge badge-draft" style="font-size:0.7rem">Preview</span>':''}
          <button class="btn btn-xs btn-outline" onclick="openLessonQuizManager(${courseId},${l.id},'${(l.title||'').replace(/'/g,"\\'")}')">❓ Quiz</button>
          <button class="btn btn-xs" style="background:rgba(255,107,107,0.1);color:var(--admin)" onclick="deleteLesson(${courseId},${ch.id},${l.id})">✕</button>
        </div>`).join('') || '<p style="color:var(--text3);font-size:0.85rem;padding:8px 0">No lessons – add one above</p>'}
      </div>
    </div>`;
  }));
  return parts.join('');
}

async function refreshChapters(courseId) {
  const chapRes = await api('GET', `/educator/courses/${courseId}/chapters`).catch(()=>({data:[]}));
  const html = await buildChaptersHtml(courseId, chapRes.data || []);
  const cont = document.getElementById('chapters-container');

async function saveCourseSettings(courseId) {

/* ---- Single-lesson quiz manager: create-or-manage the one quiz for this lesson ---- */
async function openLessonQuizManager(courseId, lessonId, lessonTitle) {
  showLoader();
  try {
    const res = await api('GET', `/educator/courses/${courseId}/quizzes`, null);
    const quizzes = res.data || [];
    const existing = quizzes.find(q => q.lesson_id === lessonId);
    if (existing) {
      closeModal();
      openQuizDetail(courseId, existing.id);
    } else {
      openCreateQuizModal(courseId, 'lesson', lessonId, lessonTitle);

}

async function createQuiz(courseId, level, lessonId) {
  const title = document.getElementById('qz-title').value.trim();

function quizQuestionsHtml(courseId, quizId, questions) {
  if (!questions.length) return '<div class="empty-state"><div class="empty-icon">❓</div><div class="empty-text">No questions yet</div><div class="empty-sub">Add at least one question above</div></div>';
  return questions.map((qq,i) => `
    <div class="question-card">
      <div class="question-card-head">
        <div><span class="question-num">Q${i+1}</span> <span class="qtype-badge">${fmt.qtype(qq.question_type)}</span>
          <p style="margin-top:6px;font-size:0.92rem">${qq.question_text}</p>
        </div>
        <button class="btn btn-xs" style="background:rgba(255,107,107,0.1);color:var(--admin);flex-shrink:0" onclick="deleteQuestion(${courseId},${quizId},${qq.id})">✕</button>
      </div>
      ${questionOptionsPreviewHtml(qq)}
    </div>`).join('');
}

function questionOptionsPreviewHtml(qq) {
  const correct = qq.correct_answers || [];
  switch (qq.question_type) {
    case 'mcq_single':
    case 'mcq_multiple':
      return (qq.options||[]).map((opt,i)=>`<div class="option-row ${correct.includes(i)?'correct-answer':''}" style="cursor:default">${qq.question_type==='mcq_single'?'◯':'▢'} ${opt} ${correct.includes(i)?'✓':''}</div>`).join('');
    case 'true_false':
      return ['True','False'].map((opt,i)=>`<div class="option-row ${correct.includes(i)?'correct-answer':''}" style="cursor:default">◯ ${opt} ${correct.includes(i)?'✓':''}</div>`).join('');
    case 'fill_blank':
      return `<p style="font-size:0.85rem;color:var(--text2)">Accepted answers: <strong style="color:var(--student)">${correct.join(', ')}</strong></p>`;
    case 'matching': {
      const left = qq.options?.left||[], right = qq.options?.right||[];
      return correct.map(([li,ri])=>`<div class="match-row"><div class="match-pill">${left[li]??'–'}</div><span>↔</span><div class="match-pill" style="border-color:var(--student)">${right[ri]??'–'}</div></div>`).join('');
    }
    case 'ordering':
      return `<p style="font-size:0.85rem;color:var(--text2)">Correct order: <strong style="color:var(--student)">${correct.map(i=>qq.options[i]).join(' → ')}</strong></p>`;
    default: return '';
  }
}

      <select class="form-input form-select" id="qb-type" onchange="renderQuestionBuilderFields()">

        <option value="mcq_multiple">Multiple Choice — Multiple Answers</option>
        <option value="true_false">True / False</option>
        <option value="fill_blank">Fill in the Blank</option>
        <option value="matching">Matching</option>
        <option value="ordering">Ordering</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Question Text *</label><textarea class="form-input" id="qb-text" placeholder="Type the question..."></textarea></div>
    <div class="form-group"><label class="form-label">Points</label><input class="form-input" id="qb-points" type="number" min="1" value="1" style="max-width:120px" /></div>

function renderQuestionBuilderFields() {
  const type = document.getElementById('qb-type').value;
  const c = document.getElementById('qb-fields');
  if (type === 'mcq_single' || type === 'mcq_multiple') {
    c.innerHTML = `
      <p class="form-label">Options (check the correct ${type==='mcq_single'?'one':'ones'}) *</p>
      <div id="qb-opts">
        ${[0,1,2,3].map(i=>`<div class="flex gap-1" style="margin-bottom:8px;align-items:center">
          <input type="${type==='mcq_single'?'radio':'checkbox'}" name="qb-correct" value="${i}" />
          <input class="form-input option-mini-input" id="qb-opt-${i}" placeholder="Option ${i+1}" />
        </div>`).join('')}
      </div>
      <button class="btn btn-outline btn-xs" onclick="addMcqOptionRow('${type}')">+ Add Option</button>`;
  } else if (type === 'true_false') {
    c.innerHTML = `<p class="form-label">Correct Answer *</p>
      <div class="flex gap-2">
        <label class="flex gap-1" style="align-items:center"><input type="radio" name="qb-tf" value="0" checked/> True</label>
        <label class="flex gap-1" style="align-items:center"><input type="radio" name="qb-tf" value="1"/> False</label>
      </div>`;
  } else if (type === 'fill_blank') {
    c.innerHTML = `<div class="form-group"><label class="form-label">Accepted Answer(s) — comma separated *</label>
      <input class="form-input" id="qb-fb-answers" placeholder="e.g. Paris, paris" /></div>
      <div class="form-group"><label class="form-label">Word Bank (optional, comma separated)</label>
      <input class="form-input" id="qb-fb-bank" placeholder="e.g. Paris, London, Rome" /></div>`;
  } else if (type === 'matching') {
    c.innerHTML = `
      <p class="form-label">Pairs — left matches right, in the same row order *</p>
      <div id="qb-match-rows">
        ${[0,1,2].map(i=>`<div class="form-row" style="margin-bottom:8px" data-row="${i}">
          <input class="form-input" id="qb-match-l-${i}" placeholder="Left item ${i+1}" />
          <input class="form-input" id="qb-match-r-${i}" placeholder="Matching right item ${i+1}" />
        </div>`).join('')}
      </div>
      <button class="btn btn-outline btn-xs" onclick="addMatchRow()">+ Add Pair</button>`;
  } else if (type === 'ordering') {
    c.innerHTML = `
      <p class="form-label">Items in CORRECT order (top = first) *</p>
      <div id="qb-order-rows">
        ${[0,1,2].map(i=>`<input class="form-input" id="qb-order-${i}" placeholder="Step ${i+1}" style="margin-bottom:8px" />`).join('')}
      </div>
      <button class="btn btn-outline btn-xs" onclick="addOrderRow()">+ Add Item</button>`;
  }
}

function addMcqOptionRow(type) {
  const wrap = document.getElementById('qb-opts');
  const i = wrap.children.length;
  const row = document.createElement('div');
  row.className = 'flex gap-1'; row.style.marginBottom = '8px'; row.style.alignItems = 'center';
  row.innerHTML = `<input type="${type==='mcq_single'?'radio':'checkbox'}" name="qb-correct" value="${i}" />
    <input class="form-input option-mini-input" id="qb-opt-${i}" placeholder="Option ${i+1}" />`;
  wrap.appendChild(row);
}
function addMatchRow() {
  const wrap = document.getElementById('qb-match-rows');
  const i = wrap.children.length;
  const row = document.createElement('div');
  row.className = 'form-row'; row.style.marginBottom = '8px'; row.dataset.row = i;
  row.innerHTML = `<input class="form-input" id="qb-match-l-${i}" placeholder="Left item ${i+1}" />
    <input class="form-input" id="qb-match-r-${i}" placeholder="Matching right item ${i+1}" />`;
  wrap.appendChild(row);
}
function addOrderRow() {
  const wrap = document.getElementById('qb-order-rows');
  const i = wrap.children.length;
  const inp = document.createElement('input');
  inp.className = 'form-input'; inp.id = `qb-order-${i}`; inp.placeholder = `Step ${i+1}`; inp.style.marginBottom = '8px';
  wrap.appendChild(inp);
}

async function submitNewQuestion(courseId, quizId) {
  const type = document.getElementById('qb-type').value;
  const question_text = document.getElementById('qb-text').value.trim();
  const points = +document.getElementById('qb-points').value || 1;
  if (!question_text) return toast('Question text required','error');

  let options = null, correct_answers = null;

  try {
    if (type === 'mcq_single' || type === 'mcq_multiple') {
      const wrap = document.getElementById('qb-opts');
      const opts = [...wrap.children].map((row,i) => document.getElementById(`qb-opt-${i}`).value.trim());
      options = opts.filter(o => o);
      const checked = [...wrap.querySelectorAll('input[name="qb-correct"]:checked')].map(el=>+el.value);
      if (options.length < 2) return toast('Add at least 2 options','error');
      if (!checked.length) return toast('Mark the correct answer(s)','error');
      correct_answers = checked;
    } else if (type === 'true_false') {
      correct_answers = [+document.querySelector('input[name="qb-tf"]:checked').value];
    } else if (type === 'fill_blank') {
      const answers = document.getElementById('qb-fb-answers').value.split(',').map(s=>s.trim()).filter(Boolean);
      if (!answers.length) return toast('At least 1 accepted answer required','error');
      const bank = document.getElementById('qb-fb-bank').value.split(',').map(s=>s.trim()).filter(Boolean);
      correct_answers = answers;
      options = bank.length ? { word_bank: bank } : null;
    } else if (type === 'matching') {
      const wrap = document.getElementById('qb-match-rows');
      const left = [], right = [];
      [...wrap.children].forEach((row,i) => {
        const l = document.getElementById(`qb-match-l-${i}`).value.trim();
        const r = document.getElementById(`qb-match-r-${i}`).value.trim();
        if (l && r) { left.push(l); right.push(r); }
      });
      if (left.length < 2) return toast('Add at least 2 matching pairs','error');
      options = { left, right };
      correct_answers = left.map((_,i) => [i, i]); // row i's left matches row i's right by construction
    } else if (type === 'ordering') {
      const wrap = document.getElementById('qb-order-rows');
      const items = [...wrap.children].map(inp => inp.value.trim()).filter(Boolean);
      if (items.length < 2) return toast('Add at least 2 items to order','error');
      options = items;
      correct_answers = items.map((_,i) => i); // entered in correct order already
    }

    await api('POST', `/educator/courses/${courseId}/quizzes/${quizId}/questions`, {
      question_type: type, question_text, options, correct_answers, points
    });
    toast('Question added!','success');
    openQuizDetail(courseId, quizId);
  } catch(e) { toast(e.message,'error'); }
}

    showLoader();

    closeModal();

let QUIZ_STATE = { quizId: null, courseId: null, questions: [], answers: {}, attemptId: null };

async function openTakeQuiz(quizId, courseId) {
  showLoader();
  try {
    const statusRes = await api('GET', `/educator/quiz-attempts/${quizId}/status`);
    const { unlocked, attempt } = statusRes.data || {};

    if (!unlocked) {
      openModal(`<div class="modal">
        <div class="modal-header"><h3 class="modal-title">Quiz Locked</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
        <div class="locked-banner">🔒 Complete the required lesson(s) first to unlock this quiz.</div>
        <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>
      </div>`);
      return;
    }

    if (attempt && attempt.status === 'completed') {
      return openQuizResult(quizId, courseId);
    }

    const startRes = await api('POST', `/educator/quiz-attempts/${quizId}/start`);
    const { questions, answers_so_far, resumed } = startRes.data;

    QUIZ_STATE = { quizId, courseId, questions, answers: answers_so_far || {}, attemptId: attempt?.id || null };
    renderQuizAttemptModal(resumed);
  } catch(e) { toast(e.message,'error'); } finally { hideLoader(); }
}

function renderQuizAttemptModal(resumed) {
  const { questions, answers } = QUIZ_STATE;
  openModal(`<div class="modal modal-lg">
    <div class="modal-header"><h3 class="modal-title">📝 Quiz</h3><button class="modal-close" onclick="closeQuizAttempt()">✕</button></div>
    <div class="quiz-progress-pill">
      <span>${questions.length} question(s) ${resumed?'· resumed from where you left off':''}</span>
      <span style="color:var(--text2)">No time limit — pause anytime, your progress is saved</span>
    </div>
    <div id="quiz-attempt-questions">
      ${questions.map((q,i)=>renderQuestionInput(q,i,answers[q.id])).join('')}
    </div>
    <div class="modal-actions" style="justify-content:space-between">
      <button class="btn btn-outline" onclick="saveQuizProgress(true)">💾 Save & Pause</button>
      <button class="btn btn-primary" onclick="submitQuizAttempt()">Submit Quiz →</button>
    </div>
  </div>`);
}

function renderQuestionInput(q, i, savedAnswer) {
  const id = q.id;
  let body = '';

  if (q.question_type === 'mcq_single' || q.question_type === 'true_false') {
    const opts = q.question_type === 'true_false' ? ['True','False'] : q.options;
    body = opts.map((opt,oi)=>`<label class="option-row ${savedAnswer===oi?'selected':''}">
      <input type="radio" name="qa-${id}" value="${oi}" ${savedAnswer===oi?'checked':''} onchange="setQuizAnswer(${id}, ${oi})" />
      <span>${opt}</span>
    </label>`).join('');
  } else if (q.question_type === 'mcq_multiple') {
    const sel = Array.isArray(savedAnswer) ? savedAnswer : [];
    body = q.options.map((opt,oi)=>`<label class="option-row ${sel.includes(oi)?'selected':''}">
      <input type="checkbox" name="qa-${id}" value="${oi}" ${sel.includes(oi)?'checked':''} onchange="toggleQuizMultiAnswer(${id}, ${oi}, this.checked)" />
      <span>${opt}</span>
    </label>`).join('');
  } else if (q.question_type === 'fill_blank') {
    const bank = q.options?.word_bank;
    body = bank?.length
      ? `<select class="form-input form-select" onchange="setQuizAnswer(${id}, this.value)">
          <option value="">Select an answer...</option>
          ${bank.map(w=>`<option value="${w}" ${savedAnswer===w?'selected':''}>${w}</option>`).join('')}
        </select>`
      : `<input class="form-input" placeholder="Type your answer..." value="${savedAnswer||''}" oninput="setQuizAnswer(${id}, this.value)" />`;
  } else if (q.question_type === 'matching') {
    const left = q.options?.left||[], right = q.options?.right||[];
    const sel = Array.isArray(savedAnswer) ? savedAnswer : left.map(()=>[null,null]);
    body = left.map((l,li)=>`<div class="match-row">
        <div class="match-pill">${l}</div><span>↔</span>
        <select class="form-input form-select" onchange="setQuizMatchAnswer(${id}, ${li}, this.selectedIndex-1, ${JSON.stringify(left.map((_,x)=>x))})">
          <option value="">Choose match...</option>
          ${right.map((r,ri)=>`<option value="${ri}" ${sel.find(p=>p&&p[0]===li&&p[1]===ri)?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>`).join('');
  } else if (q.question_type === 'ordering') {
    const order = Array.isArray(savedAnswer) && savedAnswer.length ? savedAnswer : q.options.map((_,idx)=>idx);
    body = `<div id="order-list-${id}">
      ${order.map(idx=>`<div class="order-item" draggable="true" data-idx="${idx}" ondragstart="orderDragStart(event)" ondragover="orderDragOver(event)" ondrop="orderDrop(event,${id})">
        <span class="order-handle">⠿</span><span>${q.options[idx]}</span>
      </div>`).join('')}
    </div>
    <p style="font-size:0.78rem;color:var(--text2);margin-top:6px">Drag items to reorder — top is first</p>`;
    setTimeout(()=>setQuizAnswer(id, order), 0);
  }

  return `<div class="question-card">
    <div class="question-num" style="margin-bottom:8px">Question ${i+1} · <span class="qtype-badge">${fmt.qtype(q.question_type)}</span></div>
    <p style="margin-bottom:12px;font-weight:500">${q.question_text}</p>
    ${body}
  </div>`;
}

function setQuizAnswer(qId, value) { QUIZ_STATE.answers[qId] = value; }

function toggleQuizMultiAnswer(qId, optIdx, checked) {
  const cur = Array.isArray(QUIZ_STATE.answers[qId]) ? [...QUIZ_STATE.answers[qId]] : [];
  if (checked) { if (!cur.includes(optIdx)) cur.push(optIdx); }
  else { const i = cur.indexOf(optIdx); if (i>-1) cur.splice(i,1); }
  QUIZ_STATE.answers[qId] = cur;
}

function setQuizMatchAnswer(qId, leftIdx, rightIdx, allLeftIndexes) {
  const cur = Array.isArray(QUIZ_STATE.answers[qId]) ? [...QUIZ_STATE.answers[qId]] : allLeftIndexes.map(()=>null);
  while (cur.length < allLeftIndexes.length) cur.push(null);
  cur[leftIdx] = rightIdx < 0 ? null : [leftIdx, rightIdx];
  QUIZ_STATE.answers[qId] = cur.filter(Boolean);
}

let _dragSrcIdx = null;
function orderDragStart(e) { _dragSrcIdx = e.target.closest('.order-item'); e.dataTransfer.effectAllowed = 'move'; }
function orderDragOver(e) { e.preventDefault(); }
function orderDrop(e, qId) {
  e.preventDefault();
  const target = e.target.closest('.order-item');
  if (!target || target === _dragSrcIdx) return;
  const list = target.parentElement;
  const items = [...list.children];
  const srcPos = items.indexOf(_dragSrcIdx), tgtPos = items.indexOf(target);
  if (srcPos < tgtPos) target.after(_dragSrcIdx); else target.before(_dragSrcIdx);
  const newOrder = [...list.children].map(el => +el.dataset.idx);
  QUIZ_STATE.answers[qId] = newOrder;
}

async function saveQuizProgress(showToastAndClose) {
  try {
    await api('PUT', `/educator/quiz-attempts/${QUIZ_STATE.quizId}/save`, { answers: QUIZ_STATE.answers });

  } catch(e) { toast(e.message,'error'); }
}

async function openTakeQuizRetry(quizId, courseId) {
  // Retake always starts a brand-new random selection (replaces the previous attempt on submit)
  showLoader();
  try {
    const startRes = await api('POST', `/educator/quiz-attempts/${quizId}/start`);
    // Force a fresh attempt: if backend resumed a stale completed-then-reopened row it still works,
    // but since /start only creates fresh rows when no in_progress attempt exists, completed attempts
    // are naturally replaced on next submit.
    const { questions, answers_so_far, resumed } = startRes.data;
    QUIZ_STATE = { quizId, courseId, questions, answers: answers_so_far || {}, attemptId: null };
    renderQuizAttemptModal(resumed);
  } catch(e) { toast(e.message,'error'); } finally { hideLoader(); }
}

function formatStudentAnswer(b) {
  if (b.submitted === null || b.submitted === undefined) return '— no answer —';
  if (b.question_type === 'mcq_single' || b.question_type === 'true_false') {
    const opts = b.question_type==='true_false' ? ['True','False'] : b.options;
    return opts?.[b.submitted] ?? String(b.submitted);
  }
  if (b.question_type === 'mcq_multiple') {
    return (Array.isArray(b.submitted)?b.submitted:[]).map(i=>b.options?.[i]).join(', ') || '—';
  }
  if (b.question_type === 'fill_blank') return String(b.submitted);
  if (b.question_type === 'matching') {
    const left = b.options?.left||[], right = b.options?.right||[];
    return (Array.isArray(b.submitted)?b.submitted:[]).filter(Boolean).map(([li,ri])=>`${left[li]}→${right[ri]}`).join(', ') || '—';
  }
  if (b.question_type === 'ordering') {
    return (Array.isArray(b.submitted)?b.submitted:[]).map(i=>b.options?.[i]).join(' → ') || '—';
  }
  return String(b.submitted);
}

function formatCorrectAnswer(b) {
  const correct = b.correct_answers || [];
  if (b.question_type === 'mcq_single' || b.question_type === 'true_false') {
    const opts = b.question_type==='true_false' ? ['True','False'] : b.options;
    return opts?.[correct[0]] ?? String(correct[0]);
  }
  if (b.question_type === 'mcq_multiple') return correct.map(i=>b.options?.[i]).join(', ');
  if (b.question_type === 'fill_blank') return correct.join(' / ');
  if (b.question_type === 'matching') {
    const left = b.options?.left||[], right = b.options?.right||[];
    return correct.map(([li,ri])=>`${left[li]}→${right[ri]}`).join(', ');
  }
  if (b.question_type === 'ordering') return correct.map(i=>b.options?.[i]).join(' → ');
  return String(correct);
}

async function checkAndEnroll(courseId, type, title, price, currency) {
  try {
    const statusRes = await api('GET', `/educator/enrollments/${courseId}/status`);
    if (statusRes.data?.is_enrolled) return toast('Already enrolled in this course!','info');
    if (type === 'paid') {
      return openPurchaseModal(courseId, title, price, currency);
    }
    await api('POST', `/educator/enrollments/${courseId}/enroll`);
    toast(`Enrolled in "${title}"!`, 'success');
    navigateTo('my-learning');
  } catch(e){ toast(e.message,'error'); }
}

function openPurchaseModal(courseId, title, price, currency) {
  openModal(`<div class="modal">
    <div class="modal-header"><h3 class="modal-title">Purchase Course</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <p style="margin-bottom:16px;color:var(--text2)">"${title}" — <strong style="color:var(--text)">${fmt.money(price,currency)}</strong></p>
    <div class="form-group"><label class="form-label">Payment Provider *</label>
      <select class="form-input form-select" id="pay-provider">
        <option value="stripe">Stripe</option><option value="paypal">PayPal</option><option value="razorpay">Razorpay</option><option value="manual">Manual / Offline</option>
      </select>
    </div>
    <div class="form-group"><label class="form-label">Payment / Transaction ID *</label><input class="form-input" id="pay-id" placeholder="e.g. txn_1234567890" /></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmPurchase(${courseId},'${(title||'').replace(/'/g,"\\'")}',${price||0},'${currency||'USD'}')">Confirm Purchase</button>
    </div>
  </div>`);
}

async function confirmPurchase(courseId, title, price, currency) {
  const payment_provider = document.getElementById('pay-provider').value;
  const payment_id = document.getElementById('pay-id').value.trim();
  if (!payment_id) return toast('Payment/Transaction ID is required','error');
  try {
    showLoader();
    await api('POST', `/educator/enrollments/${courseId}/purchase`, { payment_provider, payment_id, amount: price, currency });
    toast(`Purchased "${title}"!`, 'success');
    closeModal(); navigateTo('my-learning');
  } catch(e){ toast(e.message,'error'); } finally { hideLoader(); }
}

const TOOL_TYPES = {
  chapter_naming: '📖 Chapter Naming', course_uploading: '⬆ Course Uploading',
  engagement: '🤝 Engagement', documentation: '📄 Documentation', general: '🧰 General'
};

async function renderEducatorTools() {
  const role = getUserRole();
  const isAdmin = role === 'admin';
  const data = await api('GET', '/educator/tools');
  const tools = data.data || [];
  document.getElementById('page-container').innerHTML = `
    <div class="page-header">
      <div><h1 class="page-title">Educator Tools</h1><p class="page-sub">Guidelines & resources to help you create great courses</p></div>
      ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="openToolEditor()">+ New Tool</button>` : ''}
    </div>
    <div class="page-content">
      ${!tools.length ? `<div class="empty-state"><div class="empty-icon">🧰</div><div class="empty-text">No tools published yet</div><div class="empty-sub">${isAdmin?'Create your first guideline above':'Check back soon'}</div></div>` : `
      <div class="grid-2">
        ${tools.map(t=>{
          const meta = (()=>{ try { return typeof t.metadata==='string'?JSON.parse(t.metadata||'{}'):(t.metadata||{}); } catch { return {}; } })();
          return `<div class="card">
            <div class="card-header">
              <div><span class="qtype-badge">${TOOL_TYPES[t.tool_type]||t.tool_type}</span><h4 style="margin-top:8px">${t.tool_name}</h4></div>
              ${isAdmin ? `<div class="flex gap-1">
                <button class="btn btn-xs btn-outline" onclick='openToolEditor(${JSON.stringify(t).replace(/'/g,"&apos;")})'>✎ Edit</button>
                <button class="btn btn-xs" style="background:rgba(255,107,107,0.1);color:var(--admin)" onclick="deleteTool(${t.id})">✕</button>
              </div>` : ''}
            </div>
            <p style="font-size:0.9rem;color:var(--text2);white-space:pre-wrap;max-height:140px;overflow-y:auto">${t.tool_content||''}</p>
            ${meta.video_url ? `<video controls style="width:100%;border-radius:10px;margin-top:14px;background:#000"><source src="${meta.video_url}"></video>` : ''}
          </div>`;
        }).join('')}
      </div>`}
    </div>`;
}

function openToolEditor(tool) {
  const t = tool || {};
  const meta = t.metadata ? (typeof t.metadata==='string'?JSON.parse(t.metadata||'{}'):t.metadata) : {};
  openModal(`<div class="modal">
    <div class="modal-header"><h3 class="modal-title">${t.id?'Edit':'New'} Educator Tool</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <input type="hidden" id="tool-id" value="${t.id||''}" />
    <div class="form-group"><label class="form-label">Tool Name *</label><input class="form-input" id="tool-name" value="${t.tool_name||''}" placeholder="e.g. Chapter Naming Guide" /></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Type</label>
        <select class="form-input form-select" id="tool-type">
          ${Object.entries(TOOL_TYPES).map(([k,v])=>`<option value="${k}" ${t.tool_type===k?'selected':''}>${v}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label class="form-label">Display Order</label><input class="form-input" id="tool-order" type="number" value="${t.display_order||0}" /></div>
    </div>
    <div class="form-group"><label class="form-label">Content *</label><textarea class="form-input" id="tool-content" style="min-height:130px" placeholder="Guideline text / instructions...">${t.tool_content||''}</textarea></div>
    <div class="form-group"><label class="form-label">Video URL (optional)</label><input class="form-input" id="tool-video" value="${meta.video_url||''}" placeholder="https://... .mp4" /></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTool()">${t.id?'Save Changes':'Create Tool'}</button>
    </div>
  </div>`);
}

async function saveTool() {
  const id = document.getElementById('tool-id').value;
  const tool_name = document.getElementById('tool-name').value.trim();
  const tool_content = document.getElementById('tool-content').value.trim();
  if (!tool_name || !tool_content) return toast('Name & content are required','error');
  const body = {
    tool_name, tool_content,
    tool_type: document.getElementById('tool-type').value,
    display_order: +document.getElementById('tool-order').value || 0,
    metadata: { video_url: document.getElementById('tool-video').value || null }
  };
  try {
    showLoader();
    if (id) await api('PUT', `/educator/tools/${id}`, body);
    else await api('POST', '/educator/tools', body);
    toast(id?'Tool updated!':'Tool created!','success');
    closeModal(); renderEducatorTools();
  } catch(e){ toast(e.message,'error'); } finally { hideLoader(); }
}

async function deleteTool(id) {
  if (!confirm('Delete this tool?')) return;
  try { await api('DELETE', `/educator/tools/${id}`); toast('Deleted','success'); renderEducatorTools(); }
  catch(e){ toast(e.message,'error'); }
}
